<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Coding — Lingkan Wang</title>
<meta name="description" content="Playable vibe-coded experiments by Lingkan Wang — toys and useful interaction components, all live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #fafafa;
    --well: #f2f2f2;
    --text-1: rgba(0, 0, 0, 0.92);
    --text-2: rgba(0, 0, 0, 0.58);
    --text-3: rgba(0, 0, 0, 0.40);
    --border: rgba(0, 0, 0, 0.10);
    --check: rgba(0, 0, 0, 0.035);
    --pill: #ffffff;
    --pill-active: #f2f2f2;
    --accent: #156AF3;
    --font-sans: "Geist", -apple-system, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --canvas: #121212;
    --well: #1c1c1c;
    --text-1: rgba(255, 255, 255, 0.92);
    --text-2: rgba(255, 255, 255, 0.60);
    --text-3: rgba(255, 255, 255, 0.40);
    --border: rgba(255, 255, 255, 0.14);
    --check: rgba(255, 255, 255, 0.04);
    --pill: #1c1c1c;
    --pill-active: #2a2a2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--canvas); }
  body {
    font-family: var(--font-sans);
    font-size: 14px; line-height: 20px;
    color: var(--text-2);
    -webkit-font-smoothing: antialiased;
    padding: 0 16px 140px;
  }

  /* segmented control, sticky top center */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: center;
    padding: 20px 0 12px;
    pointer-events: none;
  }
  .seg {
    pointer-events: auto;
    display: flex; gap: 4px;
    padding: 4px;
    background: var(--pill);
    border-radius: 999px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.10);
  }
  .seg-btn {
    border: 0; background: none; cursor: pointer;
    font-family: var(--font-sans); font-size: 14px; font-weight: 500;
    color: var(--text-3);
    padding: 8px 18px; border-radius: 999px;
    transition: color 0.18s ease, background-color 0.18s ease;
  }
  .seg-btn:hover { color: var(--text-1); }
  .seg-btn[aria-selected="true"] { background: var(--pill-active); color: var(--text-1); }

  /* feed */
  main { max-width: 860px; margin: 28px auto 0; }
  .piece { margin: 0 0 72px; }
  .frame {
    position: relative;
    border: 1px dashed var(--border);
    border-radius: 22px;
    overflow: hidden;
  }
  .frame iframe {
    display: block; border: 0; background: transparent;
    width: calc(100% / var(--z, 1)); height: calc(100% / var(--z, 1));
    transform: scale(var(--z, 1)); transform-origin: 0 0;
  }
  figcaption {
    padding-top: 14px;
    text-align: center;
    font-size: 13px; color: var(--text-3);
  }
  [hidden] { display: none !important; }

  /* bottom dock */
  .dock {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 30;
    display: flex; align-items: center; gap: 4px;
    padding: 6px;
    background: var(--pill);
    border-radius: 999px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 12px 32px rgba(0, 0, 0, 0.14);
  }
  .dock a, .dock button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    border: 0; border-radius: 999px;
    background: none; cursor: pointer;
    color: var(--text-2); text-decoration: none;
    font-size: 17px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .dock a:hover, .dock button:hover { background: var(--pill-active); color: var(--text-1); }
  .dock svg { width: 18px; height: 18px; fill: currentColor; }
  [data-theme="dark"] .icon-sun-v { display: block; }
  [data-theme="dark"] .icon-moon-v { display: none; }
  .icon-sun-v { display: none; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="seg" role="tablist" aria-label="Category">
      <button class="seg-btn" role="tab" data-tab="fun" aria-selected="true">just for fun</button>
      <button class="seg-btn" role="tab" data-tab="useful" aria-selected="false">useful bits</button>
    </div>
  </header>

  <main>
    <section class="feed" id="feed-fun" role="tabpanel">
      <figure class="piece">
        <div class="frame" style="height:560px"><iframe data-src="../dog-stickers/?embed=1" title="Sticker drop — a boxful of puppies" loading="lazy"></iframe></div>
        <figcaption>Sticker drop — a boxful of puppies</figcaption>
      </figure>
      <figure class="piece">
        <div class="frame" style="height:520px"><iframe data-src="../sticker-peel/?embed=1" title="Sticker — peel it off, carry it, stick it back" loading="lazy"></iframe></div>
        <figcaption>Sticker — peel it off, carry it, stick it back</figcaption>
      </figure>
      <figure class="piece">
        <div class="frame" style="height:580px"><iframe data-src="../journey-globe/" title="Journey — a dotted map that morphs into a 3D globe" loading="lazy"></iframe></div>
        <figcaption>Journey — a dotted map that morphs into a 3D globe</figcaption>
      </figure>
      <figure class="piece">
        <div class="frame" style="height:560px"><iframe data-src="../bubble-todo/" title="Bubble to-do — a blow-a-bubble sticky note" loading="lazy"></iframe></div>
        <figcaption>Bubble to-do — a blow-a-bubble sticky note</figcaption>
      </figure>
    </section>

    <section class="feed" id="feed-useful" role="tabpanel" hidden>
      <figure class="piece">
        <div class="frame" style="height:560px"><iframe data-src="../toast_component/" title="Toast — a faithful Sonner recreation" loading="lazy"></iframe></div>
        <figcaption>Toast — a faithful Sonner recreation, zero dependencies</figcaption>
      </figure>
      <figure class="piece">
        <div class="frame" style="height:500px"><iframe data-src="../photo-transfer/" title="Transfer — photos that fly from A to B" loading="lazy"></iframe></div>
        <figcaption>Transfer — photos that fly from A to B on a spring-following bezier</figcaption>
      </figure>
      <figure class="piece">
        <div class="frame" style="height:640px"><iframe data-src="../masii-sign/" title="Sign to claim — a signature that replays to verify" loading="lazy"></iframe></div>
        <figcaption>Sign to claim — a signature that replays to verify</figcaption>
      </figure>
      <figure class="piece">
        <div class="frame" style="height:500px"><iframe data-src="../feedback-popover/" title="Feedback — a morphing popover with confetti" loading="lazy"></iframe></div>
        <figcaption>Feedback — a morphing popover with confetti</figcaption>
      </figure>
    </section>
  </main>

  <nav class="dock" aria-label="Page controls">
    <a href="../" aria-label="Back to home">&#8617;</a>
    <button type="button" id="theme-btn" aria-label="Toggle theme">
      <svg class="icon-moon-v" viewBox="0 0 256 256" aria-hidden="true"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23Z"/></svg>
      <svg class="icon-sun-v" viewBox="0 0 256 256" aria-hidden="true"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,120H24a8,8,0,0,0,0,16H48a8,8,0,0,0,0-16Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V208A8,8,0,0,0,128,200Zm104-80H208a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg>
    </button>
  </nav>

<script>
(() => {
  /* theme: shares the homepage's localStorage key */
  const root = document.documentElement;
  const saved = localStorage.getItem('theme');
  root.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
  document.getElementById('theme-btn').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  /* tabs: hydrate iframes of the visible feed only, keep them once loaded */
  const feeds = { fun: document.getElementById('feed-fun'), useful: document.getElementById('feed-useful') };
  function hydrate(feed) {
    feed.querySelectorAll('iframe[data-src]').forEach((f) => {
      f.src = f.dataset.src;
      f.removeAttribute('data-src');
    });
  }

  /* same-origin wheel bridge: when a demo doesn't consume the wheel, scroll the page */
  document.querySelectorAll('.frame iframe').forEach((f) => {
    f.addEventListener('load', () => {
      try {
        const win = f.contentWindow;
        const doc = win.document;
        win.addEventListener('wheel', (e) => {
          if (e.defaultPrevented) return;
          const el = doc.scrollingElement || doc.documentElement;
          if (el && el.scrollHeight > el.clientHeight + 1) return;
          window.scrollBy({ top: e.deltaY, left: 0 });
        }, { passive: true });
      } catch (_) { /* cross-origin frame: leave it alone */ }
    });
  });
  const btns = [...document.querySelectorAll('.seg-btn')];
  btns.forEach((btn) => btn.addEventListener('click', () => {
    btns.forEach((b) => b.setAttribute('aria-selected', String(b === btn)));
    for (const [name, feed] of Object.entries(feeds)) {
      const active = name === btn.dataset.tab;
      feed.hidden = !active;
      if (active) hydrate(feed);
    }
    window.scrollTo({ top: 0 });
  }));
  hydrate(feeds.fun);
})();
</script>
</body>
</html>
